<!doctype html>
<meta charset="utf-8">
<title>What your interviewer sees</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; flex-direction: column; height: 100vh;
    font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background: Canvas; color: CanvasText;
  }
  header { padding: 14px 18px 10px; border-bottom: 1px solid color-mix(in srgb, CanvasText 14%, Canvas); }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .sub { font-size: 12px; color: color-mix(in srgb, CanvasText 60%, Canvas); margin: 0; }

  .coverage { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px;
              border-bottom: 1px solid color-mix(in srgb, CanvasText 14%, Canvas); }
  .cap { font-size: 11px; padding: 3px 8px; border-radius: 11px; border: 1px solid transparent; white-space: nowrap; }
  .cap.full    { background: color-mix(in srgb, #1a7a4c 16%, Canvas); border-color: color-mix(in srgb, #1a7a4c 40%, Canvas); }
  .cap.partial { background: color-mix(in srgb, #9a6b00 16%, Canvas); border-color: color-mix(in srgb, #9a6b00 40%, Canvas); }
  .cap.off     { background: color-mix(in srgb, CanvasText 8%, Canvas);  border-color: color-mix(in srgb, CanvasText 22%, Canvas);
                 color: color-mix(in srgb, CanvasText 62%, Canvas); }

  main { flex: 1; overflow-y: auto; padding: 6px 0; }
  .row { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: baseline;
         padding: 6px 18px; border-bottom: 1px solid color-mix(in srgb, CanvasText 7%, Canvas); }
  .code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px;
          color: color-mix(in srgb, CanvasText 55%, Canvas); }
  .row.t2 .code { color: #9a6b00; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .row.t2 .code { color: #e0b34d; } }
  .what { overflow-wrap: anywhere; }
  .meta { font-size: 11px; color: color-mix(in srgb, CanvasText 52%, Canvas); text-align: right; white-space: nowrap; }
  .empty { padding: 26px 18px; color: color-mix(in srgb, CanvasText 55%, Canvas); }
  .empty b { display: block; color: CanvasText; margin-bottom: 3px; }

  footer { display: flex; align-items: center; gap: 12px; padding: 11px 18px;
           border-top: 1px solid color-mix(in srgb, CanvasText 14%, Canvas); }
  button { font: inherit; padding: 7px 15px; border-radius: 6px; cursor: pointer;
           background: transparent; color: CanvasText;
           border: 1px solid color-mix(in srgb, CanvasText 34%, Canvas); font-weight: 600; }
  button:hover { background: color-mix(in srgb, #c02626 12%, Canvas); border-color: #c02626; color: #c02626; }
  .tick { margin-left: auto; font-size: 11px; color: color-mix(in srgb, CanvasText 52%, Canvas); }
</style>

<header>
  <h1>What your interviewer sees</h1>
  <p class="sub">This is the live feed, exactly as it is being sent. Nothing else is sent.</p>
</header>

<div class="coverage" id="coverage"></div>

<main id="feed">
  <div class="empty"><b>Waiting for the first reading…</b>Monitoring has started.</div>
</main>

<footer>
  <button onclick="window.stopMonitoring()">Stop monitoring</button>
  <span class="tick" id="tick"></span>
</footer>

<script>
  // Rendered from the same envelope that goes on the wire. If it is not here, it was not sent.
  const LABELS = {
    S1: "Running application",
    S2: "Signature check",
    S3: "Using the microphone",
    S5: "Hidden from screen sharing",
    S6: "Active window",
  };
  const CAP_LABELS = {
    S1_processes: "applications",
    S2_signature: "signatures",
    S3_mic_owner: "microphone",
    S5_capture_excluded: "hidden windows",
    S6_window_titles: "window titles",
    process_paths: "app details",
    host_machine: "host machine",
    realtime_events: "live events",
  };

  window.renderCoverage = function (report) {
    const el = document.getElementById("coverage");
    el.innerHTML = "";
    const caps = report.capabilities || {};
    for (const key of Object.keys(caps)) {
      const v = caps[key];
      const state = typeof v === "string" ? v : v.state;
      const span = document.createElement("span");
      span.className = "cap " + (state === "full" ? "full" : state === "partial" ? "partial" : "off");
      const mark = state === "full" ? "✓" : state === "partial" ? "~" : "✗";
      span.textContent = (CAP_LABELS[key] || key) + " " + mark;
      span.title = key + ": " + state + (typeof v === "object" && v.reason ? " (" + v.reason + ")" : "");
      el.appendChild(span);
    }
  };

  window.renderSample = function (env) {
    const feed = document.getElementById("feed");
    const signals = env.signals || [];

    // Tier 2 first, then the active window, then everything else. The interviewer's panel orders
    // it the same way, and this window must not disagree with it.
    const shown = signals
      .filter((s) => s.tier === 2 || s.code === "S6" || s.code === "S3")
      .sort((a, b) => a.tier - b.tier);

    feed.innerHTML = "";
    if (shown.length === 0) {
      const d = document.createElement("div");
      d.className = "empty";
      d.innerHTML = "<b>Nothing flagged.</b>Read this together with the coverage row above — " +
                    "it says what is and is not being looked at.";
      feed.appendChild(d);
    }

    for (const s of shown) {
      const row = document.createElement("div");
      row.className = "row t" + s.tier;

      const code = document.createElement("span");
      code.className = "code";
      code.textContent = s.code;

      const what = document.createElement("span");
      what.className = "what";
      const subj = s.subject || {};
      const d = s.detail || {};
      // A render-endpoint row is never a mic-possession claim (see backend: holds_microphone is
      // always false there) — WASAPI cannot tell a loopback capture apart from ordinary playback,
      // so this window must not say "using the microphone" for what might just be music playing.
      const isRenderFlow = s.code === "S3" && d.endpoint_flow === "render";
      const label = isRenderFlow ? "Audio session (playback endpoint)" : (LABELS[s.code] || s.code);
      let text = label + " — " + (subj.name || "pid " + subj.pid);
      if (s.code === "S6" && d.window && d.window.title) text += " — " + d.window.title;
      // holds_microphone is possession, not activity — session_state is what says whether it is
      // capturing right now. Saying "using the microphone" for an idle session would overstate it.
      if (s.code === "S3" && d.session_state !== "active") {
        text += isRenderFlow ? " (not currently active)" : " (session open, not listening)";
      }
      what.textContent = text;

      const meta = document.createElement("span");
      meta.className = "meta";
      // has_window counts hidden windows; has_visible_window is the one a person can check against
      // what is actually on their screen. Meaningless for a render-flow row — that discriminator is
      // what makes a *microphone* holder read as an audio-only assistant, not a playback session.
      if (s.code === "S3" && !isRenderFlow && d.has_visible_window === false) meta.textContent = "no visible window";
      else if (s.code === "S5") meta.textContent = d.affinity_name || "";

      row.append(code, what, meta);
      feed.appendChild(row);
    }

    const m = env.sample_meta || {};
    const t = new Date(env.ts).toLocaleTimeString();
    document.getElementById("tick").textContent =
      "reading " + env.seq + " at " + t + (m.complete === false ? " — incomplete reading" : "");
  };
</script>
