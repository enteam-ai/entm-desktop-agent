[workspace]
resolver = "2"
members = ["crates/cp-signals", "crates/cp-win"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
panic = "unwind" # the probe host catches panics at the command boundary; abort would kill the agent
